<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}DeckForge Studio{% endblock %}</title>
<style>
  :root{--navy:#041C2C;--blue:#00A9F4;--ink:#1A1A1A;--muted:#6B7280;--line:#E6E6E6;--bg:#F6F8FA;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
       color:var(--ink);background:var(--bg);line-height:1.5;}
  header{background:var(--navy);color:#fff;padding:16px 28px;display:flex;align-items:baseline;gap:12px;}
  header .logo{font-family:Georgia,"Times New Roman",serif;font-weight:bold;font-size:22px;letter-spacing:.2px;}
  header .tag{color:#9FC2D2;font-size:13px;}
  header a{margin-left:auto;color:#9FC2D2;font-size:13px;text-decoration:none;}
  main{max-width:1020px;margin:26px auto;padding:0 20px;}
  h1{font-family:Georgia,"Times New Roman",serif;color:var(--navy);font-size:26px;margin:.2em 0 .3em;}
  h2{font-family:Georgia,"Times New Roman",serif;color:var(--navy);font-size:18px;margin:.2em 0 .6em;}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px 26px;margin-bottom:20px;}
  label{display:block;font-weight:600;font-size:12.5px;margin:14px 0 6px;color:#33414d;}
  input[type=text],textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);
       border-radius:8px;font-size:14px;font-family:inherit;background:#fff;}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--blue);}
  textarea{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;
       line-height:1.55;min-height:360px;white-space:pre;}
  .row{display:flex;gap:16px;flex-wrap:wrap;}.row>div{flex:1;min-width:170px;}
  .btn{background:var(--blue);color:#fff;border:none;padding:12px 24px;border-radius:8px;
       font-size:15px;font-weight:600;cursor:pointer;}
  .btn:hover{filter:brightness(1.06)}
  a{color:#0a84c7;text-decoration:none;}a:hover{text-decoration:underline;}
  .muted{color:var(--muted);font-size:13px;}
  .err{background:#FDECEC;border:1px solid #F3B6B6;color:#9B1C1C;padding:12px 14px;
       border-radius:8px;margin:6px 0 16px;font-size:13.5px;}
  .shots{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:8px;}
  .shots img{width:100%;border:1px solid var(--line);border-radius:6px;display:block;}
  footer{max-width:1020px;margin:6px auto 44px;padding:0 20px;color:var(--muted);font-size:12.5px;}
</style>
</head>
<body>
<header>
  <span class="logo">DeckForge</span>
  <span class="tag">Studio &middot; consulting-grade decks from data</span>
  <a href="https://github.com/frankglendon/deckforge">GitHub</a>
</header>
<main>{% block body %}{% endblock %}</main>
<footer>DeckForge &middot; MIT &middot; native, editable PowerPoint &middot;
  design language inspired by public consulting reports (not affiliated with any firm).</footer>
</body>
</html>
